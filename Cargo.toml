[workspace]
resolver = "3"
members = [
    "crates/wm-core",
    "crates/wm-platform",
    "crates/wm-daemon",
    "crates/wmctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
